<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피전문점 브랜드평판 순위 변화</title>
<style>
:root {
  color-scheme: light;
  --ink: #16201f;
  --muted: #65706e;
  --line: #d9e1de;
  --paper: #f7f4ef;
  --panel: #ffffff;
  --accent: #0f766e;
  --accent-2: #9f5f21;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
}
.wrap {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 34px;
}
header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: end;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
h1 {
  margin: 0;
  font-size: clamp(26px, 4vw, 46px);
  line-height: 1.08;
  letter-spacing: 0;
}
.meta {
  margin-top: 10px;
  color: var(--muted);
  font-size: 15px;
}
.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.stat {
  min-width: 106px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.62);
  border-radius: 8px;
}
.stat b {
  display: block;
  font-size: 19px;
  line-height: 1.1;
}
.stat span {
  color: var(--muted);
  font-size: 12px;
}
.stage {
  margin-top: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 18px 44px rgba(44, 39, 30, .08);
}
.toolbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid var(--line);
  background: #fbfaf7;
}
button {
  width: 42px;
  height: 38px;
  border: 1px solid #b8c5c0;
  background: #fff;
  color: var(--ink);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
button:hover { border-color: var(--accent); color: var(--accent); }
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.month {
  min-width: 108px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--accent);
}
.chart {
  position: relative;
  height: 520px;
  padding: 24px 28px 34px;
}
.axis {
  position: absolute;
  inset: 24px 28px 34px 210px;
  pointer-events: none;
}
.gridline {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #edf1ef;
}
.gridline span {
  position: absolute;
  top: -18px;
  transform: translateX(-50%);
  color: #8a9693;
  font-size: 11px;
  white-space: nowrap;
}
.row {
  position: absolute;
  left: 28px;
  right: 28px;
  height: 62px;
  transition: transform 650ms cubic-bezier(.22,.8,.28,1), opacity 300ms ease;
}
.rank {
  position: absolute;
  left: 0;
  width: 40px;
  top: 16px;
  font-size: 19px;
  font-weight: 800;
  color: #83908d;
  text-align: right;
}
.name {
  position: absolute;
  left: 54px;
  width: 138px;
  top: 11px;
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar {
  position: absolute;
  left: 210px;
  top: 12px;
  height: 38px;
  border-radius: 7px;
  min-width: 4px;
  transition: width 650ms cubic-bezier(.22,.8,.28,1);
  box-shadow: inset 0 -12px 22px rgba(0,0,0,.08);
}
.value {
  position: absolute;
  top: 18px;
  font-size: 16px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  transition: left 650ms cubic-bezier(.22,.8,.28,1);
  white-space: nowrap;
}
.stamp {
  position: absolute;
  right: 34px;
  bottom: 26px;
  font-size: clamp(58px, 12vw, 142px);
  line-height: .85;
  font-weight: 900;
  color: rgba(22, 32, 31, .075);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.note {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px 16px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
  background: #fbfaf7;
}
@media (max-width: 760px) {
  header { grid-template-columns: 1fr; }
  .stats { justify-content: flex-start; }
  .toolbar { grid-template-columns: auto 1fr; }
  .month { grid-column: 1 / -1; text-align: left; }
  .chart { height: 440px; padding: 18px 12px 28px; }
  .axis { inset: 18px 12px 28px 126px; }
  .row { left: 12px; right: 12px; height: 56px; }
  .rank { width: 28px; top: 15px; font-size: 16px; }
  .name { left: 36px; width: 84px; top: 13px; font-size: 14px; }
  .bar { left: 126px; top: 13px; height: 32px; }
  .value { top: 17px; font-size: 12px; }
  .stamp { right: 18px; bottom: 18px; }
  .note { flex-direction: column; }
}
</style>
</head>

<main class="wrap">
  <header>
    <div>
      <h1>커피전문점 브랜드평판<br>Top 5 순위 변화</h1>
      <div class="meta">한국기업평판연구소 게시글 본문에서 월별 브랜드평판지수만 추출</div>
    </div>

    </div>
  </header>

  <section class="stage" aria-label="월별 브랜드평판 순위 애니메이션">
    <div class="toolbar">
      <button id="play" type="button" aria-label="재생 또는 일시정지">▶</button>
      <input id="range" type="range" min="0" max="0" value="0" aria-label="월 선택">
      <div id="month" class="month"></div>
    </div>
    <div id="chart" class="chart">
      <div id="axis" class="axis"></div>
      <div id="stamp" class="stamp"></div>

    <div class="note">
      <span>각 월 게시글의 1위부터 5위까지 행만 사용했습니다.</span>
      <span>원천: brikorea.com 브랜드평판지수 게시판</span>
    </div>
  </section>
</main>

const rows = rawRows.map(row => ({
  year_month: row[0],
  rank: row[1],
  brand: row[2],
  brand_reputation_index: row[3]
}));
const byMonth = new Map();
for (const row of rows) {
  if (!byMonth.has(row.year_month)) byMonth.set(row.year_month, []);
  byMonth.get(row.year_month).push(row);
}
const months = [...byMonth.keys()].sort();
const palette = ["#0f766e", "#b7791f", "#2563eb", "#be123c", "#6d5dfc", "#15803d", "#c2410c", "#0369a1", "#7c3aed", "#475569", "#a16207", "#047857"];
const brands = [...new Set(rows.map(row => row.brand))].sort();
const color = new Map(brands.map((brand, index) => [brand, palette[index % palette.length]]));
const chart = document.getElementById("chart");
const axis = document.getElementById("axis");
const stamp = document.getElementById("stamp");
const range = document.getElementById("range");
const monthLabel = document.getElementById("month");
const play = document.getElementById("play");
const rowEls = new Map();
let current = 0;
let timer = null;

range.max = Math.max(0, months.length - 1);

function formatNumber(value) {
  return new Intl.NumberFormat("ko-KR").format(value);
}

function drawAxis(maxValue) {
  axis.innerHTML = "";
  for (let i = 0; i <= 4; i += 1) {
    const line = document.createElement("div");
    line.className = "gridline";
    line.style.left = `${i * 25}%`;
    const label = document.createElement("span");
    label.textContent = i === 0 ? "0" : formatNumber(Math.round(maxValue * i / 4));
    line.appendChild(label);
    axis.appendChild(line);
  }
}

function ensureRow(brand) {
  if (rowEls.has(brand)) return rowEls.get(brand);
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<div class="rank"></div><div class="name"></div><div class="bar"></div><div class="value"></div>`;
  el.querySelector(".name").textContent = brand;
  el.querySelector(".bar").style.background = color.get(brand);
  chart.appendChild(el);
  rowEls.set(brand, el);
  return el;
}

function render(index) {
  current = Math.max(0, Math.min(index, months.length - 1));
  const month = months[current];
  const entries = [...byMonth.get(month)].sort((a, b) => a.rank - b.rank).slice(0, 5);
  const maxValue = Math.max(...entries.map(row => row.brand_reputation_index));
  const chartWidth = Math.max(180, chart.clientWidth - (window.innerWidth <= 760 ? 162 : 266));
  drawAxis(maxValue);
  monthLabel.textContent = month;
  stamp.textContent = month;
  range.value = String(current);

  const visible = new Set(entries.map(row => row.brand));
  entries.forEach((row, index) => {
    const el = ensureRow(row.brand);
    const width = Math.max(4, chartWidth * row.brand_reputation_index / maxValue);
    const left = (window.innerWidth <= 760 ? 126 : 210) + width + 10;
    el.style.opacity = "1";
    el.style.transform = `translateY(${index * (window.innerWidth <= 760 ? 64 : 72)}px)`;
    el.querySelector(".rank").textContent = row.rank;
    el.querySelector(".bar").style.width = `${width}px`;
    el.querySelector(".value").style.left = `${left}px`;
    el.querySelector(".value").textContent = formatNumber(row.brand_reputation_index);
  });
  for (const [brand, el] of rowEls) {
    if (!visible.has(brand)) el.style.opacity = "0";
  }
}

function start() {
  if (timer) return;
  play.textContent = "Ⅱ";
  timer = window.setInterval(() => {
    render(current >= months.length - 1 ? 0 : current + 1);
  }, 1150);
}

function stop() {
  window.clearInterval(timer);
  timer = null;
  play.textContent = "▶";
}

play.addEventListener("click", () => timer ? stop() : start());
range.addEventListener("input", event => {
  stop();
  render(Number(event.target.value));
});
window.addEventListener("resize", () => render(current));
render(0);
start();
</script>
