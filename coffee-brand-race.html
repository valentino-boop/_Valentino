<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피전문점 브랜드평판 월별 랭킹</title>
<style>
:root {
  color-scheme: light;
  --ink: #171f1d;
  --muted: #66736f;
  --paper: #f5f1ea;
  --panel: #fffdf8;
  --line: #d8ddd6;
  --grid: #e7ebe5;
  --accent: #0057b8;
  --rank: #70491f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
.wrap { width: min(1720px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 34px; }
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.08; letter-spacing: 0; }
.lead { margin-top: 10px; color: var(--muted); font-size: 15px; }
.metrics { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.metric { min-width: 104px; border: 1px solid var(--line); background: rgba(255,255,255,.66); border-radius: 8px; padding: 9px 11px; }
.metric b { display: block; font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric span { color: var(--muted); font-size: 12px; }
.board { margin-top: 18px; display: grid; grid-template-columns: 1fr; gap: 14px; }
.chart-card, .details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 40px rgba(44, 39, 30, .075); }
.chart-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); background: #fbfaf7; }
.chart-head h2, .details h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
select { height: 34px; min-width: 124px; border: 1px solid #b6c2bd; border-radius: 8px; background: #fff; color: var(--ink); padding: 0 10px; font-weight: 750; }
.chart-wrap { position: relative; height: 690px; padding: 18px 18px 8px; overflow-x: auto; overflow-y: hidden; }
svg { display: block; min-width: 2240px; width: 100%; height: 642px; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.rank-label { fill: var(--rank); font-size: 14px; font-weight: 850; }
.month-label { fill: #68736f; font-size: 11px; font-weight: 700; }
.year-label { fill: #202b28; font-size: 12px; font-weight: 850; }
.year-tick { stroke: #cbd3cf; stroke-width: 1.2; }
.brand-line { fill: none; stroke-width: 4.8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.brand-line.dim { opacity: .13; }
.brand-point { stroke: #fffdf8; stroke-width: 2.2; cursor: pointer; }
.brand-point.dim { opacity: .18; }
.brand-name { font-size: 14px; font-weight: 900; paint-order: stroke; stroke: #fffdf8; stroke-width: 5px; stroke-linejoin: round; }
.selected-guide { stroke: #17201d; stroke-width: 1.6; stroke-dasharray: 4 5; opacity: .48; }
.details { display: grid; grid-template-columns: minmax(360px, 520px) minmax(0, 1fr); gap: 18px; padding: 14px 16px; }
.details-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#selectedMonth { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; }
.rank-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 11px; }
.rank-row { min-height: 78px; padding: 10px; border: 1px solid #e4e8e1; border-radius: 8px; background: #fff; }
.rank-num { color: #7d8985; font-weight: 950; font-size: 18px; }
.rank-brand { margin-top: 6px; font-weight: 900; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-score { margin-top: 5px; font-variant-numeric: tabular-nums; font-weight: 850; color: #26312f; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; align-content: start; gap: 8px; }
.legend button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 10px; color: var(--ink); font-size: 12px; font-weight: 750; cursor: pointer; }
.legend button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
.source { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
@media (max-width: 980px) {
  header { grid-template-columns: 1fr; } .metrics { justify-content: flex-start; }
  .chart-wrap { height: 610px; } svg { height: 570px; min-width: 1900px; }
  .details { grid-template-columns: 1fr; } .rank-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .wrap { width: min(100% - 20px, 1720px); padding-top: 20px; }
  .chart-head { grid-template-columns: 1fr; } select { width: 100%; }
  .chart-wrap { height: 560px; padding-inline: 10px; } svg { height: 520px; min-width: 1680px; }
  .rank-list { grid-template-columns: 1fr; } .source { flex-direction: column; }
}
</style>
</head>

    const first = entries[0], last = entries[entries.length - 1];

    svg.appendChild(make("text", { x: xFor(months.indexOf(last.month), width, left, right) + 12, y: yFor(last.rank, top, rowGap) + 5, fill: color.get(brand), class: "brand-name" }, brand));
  });
}
function renderSide() { selectedMonth.textContent = activeMonth; rankList.innerHTML = ""; byMonth.get(activeMonth).forEach(row => { const el = document.createElement("div"); el.className = "rank-row"; el.innerHTML = `<div class="rank-num">${row.rank}?</div><div class="rank-brand"><span class="swatch" style="background:${color.get(row.brand)}"></span>${row.brand}</div><div class="rank-score">${fmt(row.score)}</div>`; el.addEventListener("mouseenter", () => { activeBrand = row.brand; update(false); }); el.addEventListener("mouseleave", () => { activeBrand = null; update(false); }); rankList.appendChild(el); }); }
function renderLegend() { legend.innerHTML = ""; brands.forEach(brand => { const button = document.createElement("button"); button.type = "button"; button.className = activeBrand === brand ? "active" : ""; button.innerHTML = `<span class="swatch" style="background:${color.get(brand)}"></span>${brand}`; button.addEventListener("click", () => { activeBrand = activeBrand === brand ? null : brand; update(false); }); legend.appendChild(button); }); }
function update(includeSide = true) { renderChart(); if (includeSide) renderSide(); renderLegend(); }
select.addEventListener("change", event => { activeMonth = event.target.value; update(); });
window.addEventListener("resize", () => update(false));
update();
</script>
</body>
</html>
