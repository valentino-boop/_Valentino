    el.className = "rank-row";
    el.innerHTML = `<div class="rank-num">${row.rank}</div><div class="rank-brand"><span class="swatch" style="background:${color.get(row.brand)}"></span>${row.brand}</div><div class="rank-score">${fmt(row.score)}</div>`;
    el.addEventListener("mouseenter", () => { activeBrand = row.brand; update(false); });
    el.addEventListener("mouseleave", () => { activeBrand = null; update(false); });
    rankList.appendChild(el);
  });
}
function renderLegend() {
  legend.innerHTML = "";
  brands.forEach(brand => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = activeBrand === brand ? "active" : "";
    button.innerHTML = `<span class="swatch" style="background:${color.get(brand)}"></span>${brand}`;
    button.addEventListener("click", () => { activeBrand = activeBrand === brand ? null : brand; update(false); });
    legend.appendChild(button);
  });
}
function update(includeSide = true) {
  renderChart();
  if (includeSide) renderSide();
  renderLegend();
}
select.addEventListener("change", event => { activeMonth = event.target.value; update(); });
window.addEventListener("resize", () => update(false));
update();
</script>
</body>
</html>
